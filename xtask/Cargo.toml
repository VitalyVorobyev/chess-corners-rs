[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
schemars.workspace = true
serde_json.workspace = true
# Default features only (no `ml-refiner`): the committed schema must match
# the npm (wasm) build, which does not enable the ONNX refiner.
chess-corners = { workspace = true, features = ["schemars"] }

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
