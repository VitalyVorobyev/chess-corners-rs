[workspace]
resolver = "2"
members = [
  "crates/box-image-pyramid",
  "crates/chess-corners-core",
  "crates/chess-corners",
  "crates/chess-corners-testutil",
  "crates/chess-corners-capi",
  "crates/chess-corners-py",
  "crates/chess-corners-wasm",
  "xtask",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/VitalyVorobyev/chess-corners-rs"
rust-version = "1.91"
categories = ["science", "multimedia::images", "algorithms"]

[workspace.dependencies]
anyhow = "1"
box-image-pyramid = { path = "crates/box-image-pyramid", version = "2.1.0" }
chess-corners = { path = "crates/chess-corners", version = "2.1.0", default-features = false }
chess-corners-core = { path = "crates/chess-corners-core", version = "2.1.0" }
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8"
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false }
js-sys = "0.3"
log = "0.4"
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
pyo3-build-config = "0.30"
rayon = "1"
resize = "0.8"
rgb = "0.8"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", default-features = false }
serde-wasm-bindgen = "0.6"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
