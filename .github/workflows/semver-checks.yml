name: semver-checks

# Blocking semver-compatibility gate for the publishable crates.
#
# Runs cargo-semver-checks against the latest published crates.io
# baseline for each package and fails the job on any breaking change.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Select stable Rust toolchain
        run: rustup override set stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Check semver compatibility
        continue-on-error: false
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          rust-toolchain: manual
          # Publishable crates only. Explicit list guards against the action
          # processing publish = false members (chess-corners-capi, -py, -wasm,
          # chess-corners-testutil) which have no crates.io baseline to diff
          # against and would pollute / abort the run.
          package: |
            box-image-pyramid
            chess-corners-core
            chess-corners
            chess-corners-ml
